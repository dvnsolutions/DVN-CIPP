# TEMPORARY — proves GITHUB_TOKEN can actually push and dispatch in this repo.
# The sync-upstream Push / Trigger-deploy steps have never executed (nothing to
# sync), so this exercises both scopes against a throwaway branch. Delete after.
name: TEMP token write test
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prove contents:write — push a throwaway branch
        run: |
          git checkout -b _token-test
          git commit --allow-empty -m "token write test"
          git push origin _token-test --force
          echo "RESULT contents:write = OK"
      - name: Prove actions:write — dispatch a workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync-upstream.yml --ref main
          echo "RESULT actions:write = OK"
      - name: Cleanup throwaway branch
        if: always()
        run: git push origin --delete _token-test || true
